name: Update profile art

# Refreshes the contribution heatmap + stats card from real data: daily, on
# push to master, and on demand. The portrait and info card are static and
# regenerated locally (see scripts/README.md).

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (public endpoint, no token)
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: A1cy

      - name: Render heatmap + stats card
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
